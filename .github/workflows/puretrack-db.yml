name: PureTrack database

# Rebuilds data/puretrack.cdb from https://puretrack.io/api/labels.json.
# When the labels changed it commits the file and refreshes the "puretrack-db" release, so the
# latest database is always at
#   https://github.com/<owner>/<repo>/releases/download/puretrack-db/puretrack.cdb
# ready to upload to the device from its web page (PureTrack Database > Upload).

on:
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puretrack-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build puretrack.cdb
        id: build
        run: |
          python3 tools/build_puretrack_cdb.py -o data/puretrack.cdb | tee build.txt
          echo "summary=$(head -n1 build.txt)" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- data/puretrack.cdb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated database
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puretrack.cdb
          git commit -m "Update PureTrack database" -m "${{ steps.build.outputs.summary }}"
          git push

      - name: Publish release asset
        if: steps.build.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Latest PureTrack aircraft labels for SkyView, rebuilt $(date -u '+%Y-%m-%d %H:%M UTC').
          ${{ steps.build.outputs.summary }}

          Install: open the device web page, go to PureTrack Database, upload puretrack.cdb and restart.
          Then select Settings > Aircrafts data > PureTrack."
          if ! gh release view puretrack-db >/dev/null 2>&1; then
            gh release create puretrack-db --title "PureTrack database" --notes "$notes" --latest=false
          else
            gh release edit puretrack-db --notes "$notes"
          fi
          gh release upload puretrack-db data/puretrack.cdb --clobber
